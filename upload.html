<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>رفع فيديو - RamzTok</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            height: 100vh;
            overflow: hidden;
        }
        /* الشريط السفلي الموحد */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: row-reverse;
            justify-content: space-around;
            align-items: center;
            padding: 8px 0 12px;
            border-top: 1px solid #222;
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #aaa;
            font-size: 12px;
            text-decoration: none;
            transition: color 0.2s;
        }
        .nav-item i {
            font-size: 24px;
            margin-bottom: 3px;
        }
        .nav-item.active {
            color: #ff2a55;
        }
        /* الشريط العلوي الموحد */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 90;
        }
        .left-icons {
            display: flex;
            gap: 16px;
        }
        .search-icon, .live-icon {
            color: white;
            font-size: 22px;
            background: none;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .search-icon:hover, .live-icon:hover {
            opacity: 0.8;
        }
        .live-icon span {
            font-size: 14px;
            font-weight: bold;
        }
        .top-tabs {
            display: flex;
            gap: 30px;
            font-weight: bold;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }
        .tab-link {
            color: #aaa;
            text-decoration: none;
            padding-bottom: 4px;
            font-size: 16px;
        }
        .tab-link.active {
            color: white;
            border-bottom: 2px solid #ff2a55;
        }
        /* محتوى رفع الفيديو – الكاميرا */
        .upload-container {
            padding: 70px 16px 80px;
            height: 100vh;
            overflow-y: auto;
        }
        .camera-screen {
            background: #111;
            border-radius: 24px;
            overflow: hidden;
            position: relative;
        }
        .camera-view {
            position: relative;
            aspect-ratio: 9 / 16;
            background: #000;
        }
        .camera-view video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.2s;
            transform-origin: center center;
        }
        .top-tools-upload {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(6px);
            z-index: 10;
        }
        .glass-btn {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(8px);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .mode-bar {
            position: absolute;
            bottom: 135px;
            left: 16px;
            right: 16px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 6px;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(6px);
            border-radius: 30px;
            z-index: 10;
        }
        .mode-item {
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 13px;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
        }
        .mode-item.active {
            background: #ff2a55;
            color: white;
        }
        .tab-bar {
            position: absolute;
            bottom: 95px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 30px;
            z-index: 10;
        }
        .tab-btn {
            background: transparent;
            border: none;
            color: #888;
            font-size: 16px;
            font-weight: bold;
            padding: 8px 20px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }
        .tab-btn.active {
            color: white;
            border-bottom-color: #ff2a55;
        }
        .record-tools {
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 12px 16px;
            background: #000;
            border-top: 1px solid #222;
        }
        .side-btn {
            background: none;
            border: none;
            color: #eee;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .side-btn span {
            font-size: 10px;
        }
        .record-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 4px solid #ff2a55;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .record-btn .inner {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #ff2a55;
            transition: all 0.3s;
        }
        .record-btn.recording .inner {
            border-radius: 6px;
            width: 26px;
            height: 26px;
            background: white;
        }
        .record-timer {
            font-size: 16px;
            font-weight: bold;
            display: none;
        }
        .record-timer.visible {
            display: block;
        }
        /* شاشة المعاينة */
        .preview-screen {
            display: none;
            background: #121212;
            border-radius: 24px;
            overflow: hidden;
        }
        .preview-screen.active {
            display: block;
        }
        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #121212;
            border-bottom: 1px solid #2c2c2c;
        }
        .preview-video {
            aspect-ratio: 9 / 16;
            background: #000;
        }
        .preview-video video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .caption-input {
            width: calc(100% - 32px);
            margin: 16px;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 12px;
            color: white;
            resize: vertical;
        }
        .cover-section {
            margin: 0 16px 16px;
        }
        .cover-label {
            font-size: 14px;
            color: #ccc;
        }
        .cover-preview-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 8px;
        }
        .cover-image {
            width: 60px;
            height: 80px;
            background: #333;
            border-radius: 8px;
            background-size: cover;
        }
        .cover-slider {
            flex: 1;
            accent-color: #ff2a55;
        }
        .post-btn {
            background: #ff2a55;
            border: none;
            padding: 14px;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            margin: 0 16px 24px;
            width: calc(100% - 32px);
            cursor: pointer;
        }
        .post-btn:disabled {
            background: #555;
            cursor: not-allowed;
        }
        .effects-panel, .music-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1a1a1a;
            border-radius: 24px 24px 0 0;
            padding: 20px;
            z-index: 30;
            display: none;
            flex-direction: column;
            gap: 12px;
            max-height: 50vh;
            overflow-y: auto;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        .effect-item, .music-item {
            background: #2c2c2c;
            border-radius: 12px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
        }
        .zoom-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7);
            border-radius: 40px;
            padding: 8px 16px;
            display: flex;
            gap: 12px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 15;
        }
        .zoom-container.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .confirm-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }
        .confirm-box {
            background: #1e1e1e;
            border-radius: 16px;
            padding: 20px;
            width: 80%;
            text-align: center;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #333;
            border-radius: 3px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: #ff2a55;
            transition: width 0.3s;
        }
        #globalToast {
            position: fixed;
            bottom: 85px;
            left: 20px;
            right: 20px;
            background: #1f1f1f;
            color: white;
            padding: 12px 16px;
            border-radius: 40px;
            text-align: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            font-size: 14px;
            border-left: 4px solid #ff2a55;
        }
        canvas.hidden {
            display: none;
        }
    </style>

</head>
<body>

    <!-- الشريط العلوي الموحد -->

        <div id="cameraScreen" class="camera-screen">

                <video id="cameraPreview" autoplay playsinline muted></video>
                <div class="top-tools-upload">

                        <button class="glass-btn" id="addSoundBtn"><i class="fas fa-music"></i></button>

                <button class="glass-btn" id="backToCameraBtn"><i class="fas fa-arrow-right"></i></button>

                <video id="videoPlayer" controls playsinline></video>

            <textarea id="caption" class="caption-input" placeholder="أضف وصفاً..."></textarea>

                <div class="cover-label">اختر غلافاً</div>
                <div class="cover-preview-wrapper">

                    <input type="range" class="cover-slider" id="coverSlider" min="0" max="100" value="0" disabled>

            <button class="post-btn" id="postBtn" disabled>نشر</button>

    <!-- الشريط السفلي الموحد -->
    <div class="bottom-nav">
        <a href="home.html" class="nav-item"><i class="fas fa-home"></i><span>الرئيسية</span></a>
        <a href="friends.html" class="nav-item"><i class="fas fa-users"></i><span>الأصدقاء</span></a>
        <a href="upload.html" class="nav-item active"><i class="fas fa-plus-circle"></i><span>إنشاء</span></a>
        <a href="inbox.html" class="nav-item"><i class="fas fa-inbox"></i><span>الوارد</span></a>
        <a href="profile.html" class="nav-item"><i class="fas fa-user"></i><span>الملف</span></a>
    </div>

    <!-- لوحات منبثقة -->
    <div class="effects-panel" id="effectsPanel">
        <div class="panel-title" style="text-align:center;">تأثيرات</div>
        <div class="grid" id="effectsGrid"></div>
        <button class="glass-btn" style="margin-top:12px;" onclick="document.getElementById('effectsPanel').style.display='none'">إغلاق</button>
    </div>
    <div class="music-panel" id="musicPanel">
        <div class="panel-title" style="text-align:center;">موسيقى</div>
        <div class="grid" id="musicGrid"></div>
        <button class="glass-btn" id="uploadMusicBtn" style="margin-top:8px;">رفع موسيقى</button>
        <button class="glass-btn" style="margin-top:4px;" onclick="document.getElementById('musicPanel').style.display='none'">إغلاق</button>
    </div>

    <canvas id="coverCanvas" class="hidden" width="360" height="640"></canvas>
    <div id="globalToast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ==================== تهيئة Supabase ====================
        const SUPABASE_URL = 'https://fqowxtghefuykxyyrttk.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_StGuaVLO7lfCsKF0Fr1dHQ_m10dbTOO';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let userId = localStorage.getItem('ramztok_user_id');
        if (!userId) {
            userId = 'user_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('ramztok_user_id', userId);
        }
        let currentUsername = localStorage.getItem('ramztok_username');
        if (!currentUsername) {
            currentUsername = 'ramz_tok';
            localStorage.setItem('ramztok_username', currentUsername);
        }

        function formatNumber(num) {
            if (num === undefined || num === null) return '0';
            if (num >= 5000) {
                if (num >= 1e9) return (num/1e9).toFixed(1).replace(/\.0$/,'')+'B';
                if (num >= 1e6) return (num/1e6).toFixed(1).replace(/\.0$/,'')+'M';
                return (num/1e3).toFixed(1).replace(/\.0$/,'')+'K';
            }
            return num.toString();
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('globalToast');
            toast.textContent = msg;
            toast.style.opacity = '1';
            toast.style.backgroundColor = isError ? '#3a1e1e' : '#1f1f1f';
            toast.style.borderLeftColor = isError ? '#ff4444' : '#ff2a55';
            setTimeout(() => toast.style.opacity = '0', 3000);
        }

        // ==================== عناصر DOM ====================
        const cameraPreview = document.getElementById('cameraPreview');
        const recordBtn = document.getElementById('recordBtn');
        const recordTimer = document.getElementById('recordTimer');
        const videoPlayer = document.getElementById('videoPlayer');
        const coverCanvas = document.getElementById('coverCanvas');
        const coverPreview = document.getElementById('coverPreview');
        const coverSlider = document.getElementById('coverSlider');
        const coverTimeSpan = document.getElementById('coverTime');
        const postBtn = document.getElementById('postBtn');
        const captionInput = document.getElementById('caption');
        const videoInput = document.getElementById('videoInput');
        const musicInput = document.getElementById('musicInput');
        const zoomContainer = document.getElementById('zoomContainer');
        const zoomValueSpan = document.getElementById('zoomValue');
        const zoomInBtn = document.getElementById('zoomInBtn');
        const zoomOutBtn = document.getElementById('zoomOutBtn');
        const zoomResetBtn = document.getElementById('zoomResetBtn');

        let currentStream = null;
        let facingMode = 'user';
        let flashOn = false;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let recordingStartTime = 0;
        let timerInterval = null;
        let maxRecordTime = 60;
        let isLiveMode = false;
        let videoBlob = null;
        let videoDuration = 0;
        let selectedCoverDataURL = null;
        let currentFilter = 'none';
        let currentScale = 1;
        let selectedMusic = null;
        let hideZoomTimeout = null;

        const effectsList = [
            { name: 'بدون', filter: 'none', preview: '#fff' },
            { name: 'أبيض وأسود', filter: 'grayscale(1)', preview: '#aaa' },
            { name: 'بني', filter: 'sepia(1)', preview: '#8B4513' },
            { name: 'دافئ', filter: 'hue-rotate(30deg)', preview: '#f80' },
            { name: 'بارد', filter: 'hue-rotate(180deg)', preview: '#0af' }
        ];
        const builtInMusic = [
            { name: 'لحن 1', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3' },
            { name: 'لحن 2', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3' }
        ];

        // ==================== الكاميرا ====================
        async function startCamera() {
            if (currentStream) currentStream.getTracks().forEach(t => t.stop());
            try {
                const constraints = { video: { facingMode, width: { ideal: 720 }, height: { ideal: 1280 } }, audio: true };
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                cameraPreview.srcObject = currentStream;
                applyFilter();
                if (facingMode === 'environment' && flashOn) toggleFlash();
            } catch (err) {
                showToast('تعذر الوصول إلى الكاميرا', true);
            }
        }

        function applyFilter() {
            cameraPreview.style.filter = currentFilter;
        }

        function toggleFlash() {
            if (facingMode !== 'environment') { showToast('الفلاش للكاميرا الخلفية فقط', true); return; }
            flashOn = !flashOn;
            const track = currentStream?.getVideoTracks()[0];
            if (track) track.applyConstraints({ advanced: [{ torch: flashOn }] }).catch(() => {});
            document.getElementById('flashBtn').style.color = flashOn ? '#ff2a55' : 'white';
        }

        async function switchCamera() {
            facingMode = facingMode === 'user' ? 'environment' : 'user';
            await startCamera();
        }

        // التسجيل
        function startRecording() {
            if (!currentStream) return;
            recordedChunks = [];
            mediaRecorder = new MediaRecorder(currentStream, { mimeType: 'video/webm' });
            mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
            mediaRecorder.onstop = () => {
                clearInterval(timerInterval);
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                videoBlob = blob;
                showPreview();
            };
            mediaRecorder.start(100);
            isRecording = true;
            recordBtn.classList.add('recording');
            recordTimer.classList.add('visible');
            recordingStartTime = Date.now();
            timerInterval = setInterval(updateTimer, 200);
            if (maxRecordTime > 0) setTimeout(() => { if (isRecording) stopRecording(); }, maxRecordTime * 1000);
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
            isRecording = false;
            recordBtn.classList.remove('recording');
            recordTimer.classList.remove('visible');
        }

        function updateTimer() {
            const elapsed = Math.floor((Date.now() - recordingStartTime) / 1000);
            recordTimer.textContent = `${Math.floor(elapsed/60).toString().padStart(2,'0')}:${(elapsed%60).toString().padStart(2,'0')}`;
        }

        function showPreview() {
            const url = URL.createObjectURL(videoBlob);
            videoPlayer.src = url;
            videoPlayer.onloadedmetadata = () => {
                videoDuration = videoPlayer.duration;
                coverSlider.max = videoDuration;
                coverSlider.value = 0;
                coverSlider.disabled = false;
                extractCoverFrame(0);
                updateCoverTime(0);
                document.getElementById('cameraScreen').style.display = 'none';
                document.getElementById('previewScreen').classList.add('active');
                postBtn.disabled = false;
            };
        }

        function extractCoverFrame(time) {
            videoPlayer.currentTime = time;
            videoPlayer.onseeked = () => {
                const ctx = coverCanvas.getContext('2d');
                coverCanvas.width = videoPlayer.videoWidth || 360;
                coverCanvas.height = videoPlayer.videoHeight || 640;
                ctx.drawImage(videoPlayer, 0, 0, coverCanvas.width, coverCanvas.height);
                selectedCoverDataURL = coverCanvas.toDataURL('image/jpeg');
                coverPreview.style.backgroundImage = `url(${selectedCoverDataURL})`;
                videoPlayer.onseeked = null;
            };
        }

        function updateCoverTime(time) {
            const m = Math.floor(time/60);
            const s = Math.floor(time%60);
            coverTimeSpan.textContent = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        }

        // التقريب
        function setZoom(scale) {
            currentScale = Math.min(Math.max(1, scale), 5);
            cameraPreview.style.transform = `scale(${currentScale})`;
            zoomValueSpan.textContent = currentScale.toFixed(1) + 'x';
            zoomContainer.classList.add('visible');
            clearTimeout(hideZoomTimeout);
            hideZoomTimeout = setTimeout(() => zoomContainer.classList.remove('visible'), 2000);
        }
        zoomInBtn.onclick = () => setZoom(currentScale + 0.5);
        zoomOutBtn.onclick = () => setZoom(currentScale - 0.5);
        zoomResetBtn.onclick = () => setZoom(1);

        // التأثيرات والموسيقى
        function buildEffectsPanel() {
            const grid = document.getElementById('effectsGrid');
            grid.innerHTML = '';
            effectsList.forEach(eff => {
                const div = document.createElement('div');
                div.className = 'effect-item';
                div.innerHTML = `<div style="width:40px;height:40px;background:${eff.preview};border-radius:8px;"></div><span>${eff.name}</span>`;
                div.onclick = () => {
                    currentFilter = eff.filter;
                    applyFilter();
                    document.getElementById('effectsPanel').style.display = 'none';
                };
                grid.appendChild(div);
            });
        }
        function buildMusicPanel() {
            const grid = document.getElementById('musicGrid');
            grid.innerHTML = '';
            builtInMusic.forEach(track => {
                const div = document.createElement('div');
                div.className = 'music-item';
                div.innerHTML = `<i class="fas fa-music"></i><span>${track.name}</span>`;
                div.onclick = () => {
                    selectedMusic = track;
                    document.getElementById('addSoundBtn').style.color = '#ff2a55';
                    showToast(`تم اختيار ${track.name}`);
                    document.getElementById('musicPanel').style.display = 'none';
                };
                grid.appendChild(div);
            });
        }

        // رفع الفيديو إلى Supabase
        async function uploadToSupabase() {
            if (!videoBlob) { showToast('لا يوجد فيديو', true); return; }
            postBtn.disabled = true;
            postBtn.textContent = 'جاري الرفع...';
            try {
                // رفع الفيديو
                const fileName = `video_${Date.now()}.webm`;
                const filePath = `public/${fileName}`;
                const { error: uploadError } = await supabase.storage.from('videos').upload(filePath, videoBlob);
                if (uploadError) throw uploadError;
                const { data: publicUrlData } = supabase.storage.from('videos').getPublicUrl(filePath);
                const videoUrl = publicUrlData.publicUrl;

                // رفع الغلاف (إذا وجد)
                let posterUrl = null;
                if (selectedCoverDataURL) {
                    const posterBlob = await (await fetch(selectedCoverDataURL)).blob();
                    const posterName = `poster_${Date.now()}.jpg`;
                    await supabase.storage.from('videos').upload(`public/${posterName}`, posterBlob);
                    const { data: posterUrlData } = supabase.storage.from('videos').getPublicUrl(`public/${posterName}`);
                    posterUrl = posterUrlData.publicUrl;
                }

                // إدراج في جدول videos
                const newVideo = {
                    id: `vid_${Date.now()}`,
                    src: videoUrl,
                    poster: posterUrl || 'https://via.placeholder.com/640x360?text=RamzTok',
                    user_name: currentUsername,
                    user_avatar: 'https://randomuser.me/api/portraits/lego/1.jpg',
                    description: captionInput.value.trim() || 'فيديو جديد',
                    music: selectedMusic ? selectedMusic.name : '🎵 موسيقى',
                    likes: 0,
                    comments: 0,
                    category: 'أخرى',
                    upload_time: new Date().toISOString()
                };
                const { error: insertError } = await supabase.from('videos').insert(newVideo);
                if (insertError) throw insertError;

                showToast('تم النشر بنجاح!');
                setTimeout(() => window.location.href = 'home.html', 1500);
            } catch (err) {
                console.error(err);
                showToast('فشل النشر: ' + err.message, true);
                postBtn.disabled = false;
                postBtn.textContent = 'نشر';
            }
        }

        // ==================== الأحداث ====================
        function bindEvents() {
            document.getElementById('closeUploadBtn').onclick = () => window.location.href = 'home.html';
            document.getElementById('homeFromPreviewBtn').onclick = () => window.location.href = 'home.html';
            document.getElementById('backToCameraBtn').onclick = () => {
                document.getElementById('previewScreen').classList.remove('active');
                document.getElementById('cameraScreen').style.display = 'block';
                startCamera();
            };
            document.getElementById('flashBtn').onclick = toggleFlash;
            document.getElementById('switchCameraBtn').onclick = switchCamera;
            document.getElementById('flipCameraSideBtn').onclick = switchCamera;
            document.getElementById('galleryBtn').onclick = () => videoInput.click();
            document.getElementById('uploadFromDeviceBtn').onclick = () => videoInput.click();
            videoInput.onchange = e => { if (e.target.files[0]) { videoBlob = e.target.files[0]; showPreview(); } };
            document.getElementById('addSoundBtn').onclick = () => document.getElementById('musicPanel').style.display = 'flex';
            document.getElementById('uploadMusicBtn').onclick = () => musicInput.click();
            musicInput.onchange = e => { if (e.target.files[0]) selectedMusic = { name: e.target.files[0].name }; };
            recordBtn.onclick = () => { if (isLiveMode) showToast('قيد التطوير', true); else isRecording ? stopRecording() : startRecording(); };
            document.getElementById('effectsBtn').onclick = () => document.getElementById('effectsPanel').style.display = 'flex';
            document.getElementById('speedBtn').onclick = () => showToast('السرعة قريباً');
            coverSlider.oninput = () => updateCoverTime(coverSlider.value);
            coverSlider.onchange = () => extractCoverFrame(coverSlider.value);
            postBtn.onclick = uploadToSupabase;

            document.querySelectorAll('.mode-item').forEach(btn => {
                btn.onclick = function() {
                    document.querySelectorAll('.mode-item').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    const mode = this.dataset.mode;
                    const map = { video15:15, video60:60, video180:180, video300:300 };
                    maxRecordTime = map[mode] || 60;
                };
            });
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.onclick = function() {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    isLiveMode = this.dataset.tab === 'live';
                };
            });
        }

        // ==================== بدء التشغيل ====================
        buildEffectsPanel();
        buildMusicPanel();
        startCamera();
        bindEvents();

        // Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(console.log);
        }

        // أزرار عامة
        document.getElementById('searchButton').onclick = () => window.location.href = 'search.html';
        document.getElementById('liveButton').onclick = () => window.location.href = 'live.html';
    </script>
</body>
</html>
