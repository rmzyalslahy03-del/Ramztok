<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>RamzTok | كاميرا وإنشاء</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #000;
      color: white;
      height: 100vh;
      overflow: hidden;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: row-reverse;
      justify-content: space-around;
      align-items: center;
      padding: 8px 0 12px;
      border-top: 1px solid #222;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #aaa;
      font-size: 12px;
      text-decoration: none;
      transition: color 0.2s;
      background: none;
      border: none;
      cursor: pointer;
    }

    .nav-item i {
      font-size: 24px;
      margin-bottom: 3px;
    }

    .nav-item.active {
      color: #ff2a55;
    }

    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      z-index: 90;
    }

    .left-icons {
      display: flex;
      gap: 16px;
    }

    .search-icon, .live-icon {
      color: white;
      font-size: 22px;
      background: none;
      border: none;
      cursor: pointer;
    }

    .top-tabs {
      display: flex;
      gap: 30px;
      font-weight: bold;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .tab-link {
      color: #aaa;
      text-decoration: none;
      padding-bottom: 4px;
      font-size: 16px;
    }

    .tab-link.active {
      color: white;
      border-bottom: 2px solid #ff2a55;
    }

    .feed-container {
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
    }

    .video-box {
      position: relative;
      height: 100vh;
      scroll-snap-align: start;
      background: black;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-info {
      position: absolute;
      bottom: 80px;
      left: 16px;
      right: 70px;
      z-index: 20;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 2px solid #ff2a55;
      object-fit: cover;
      cursor: pointer;
    }

    .username {
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .gold-badge { color: #ffd700; }
    .diamond-badge { color: #00ffff; }

    .follow-btn {
      background: #ff2a55;
      border: none;
      color: white;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      margin-left: 10px;
    }

    .follow-btn.following {
      background: #3a3a3a;
    }

    .description {
      margin: 8px 0;
      font-size: 14px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      cursor: pointer;
    }

    .description.expanded {
      -webkit-line-clamp: unset;
    }

    .transcript {
      margin-top: 4px;
      font-size: 12px;
      color: #ddd;
      background: rgba(0,0,0,0.5);
      padding: 4px 8px;
      border-radius: 12px;
      display: inline-block;
    }

    .music-icon {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #ddd;
    }

    .spin {
      animation: spin 2s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .side-actions {
      position: absolute;
      bottom: 80px;
      right: 10px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      z-index: 20;
    }

    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: none;
      border: none;
      color: white;
      font-size: 28px;
      cursor: pointer;
      text-shadow: 0 1px 3px black;
      transition: transform 0.1s ease;
    }

    .action-btn:active {
      transform: scale(0.9);
    }

    .action-btn span {
      font-size: 12px;
      margin-top: 4px;
    }

    .progress-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 3px;
      background: #ff2a55;
      width: 0%;
      z-index: 30;
    }

    @keyframes heartBeat {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }
    .like-btn i.animate {
      animation: heartBeat 0.3s ease;
    }

    .camera-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 300;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.3s ease;
    }
    .camera-modal.open {
      transform: translateY(0);
    }
    .camera-preview {
      flex: 1;
      background: #111;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .camera-preview video, .camera-preview canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .camera-controls {
      padding: 20px;
      display: flex;
      gap: 20px;
      justify-content: center;
      background: #000000cc;
      backdrop-filter: blur(10px);
    }
    .cam-btn {
      background: #ff2a55;
      border: none;
      color: white;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      font-size: 28px;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cam-btn:active {
      transform: scale(0.9);
    }
    .cam-btn.secondary {
      background: #333;
    }
    .upload-option {
      background: #2c2c2c;
      padding: 12px;
      border-radius: 40px;
      text-align: center;
      margin: 10px 20px;
      cursor: pointer;
    }
    .recording-timer {
      position: absolute;
      top: 20px;
      left: 20px;
      background: red;
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 14px;
    }

    .share-modal {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #111;
      border-radius: 24px 24px 0 0;
      z-index: 200;
      transform: translateY(100%);
      transition: transform 0.3s;
      padding: 20px;
      max-height: 80vh;
      overflow-y: auto;
    }
    .share-modal.open {
      transform: translateY(0);
    }
    .share-tabs {
      display: flex;
      gap: 12px;
      border-bottom: 1px solid #333;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .share-tab {
      background: none;
      border: none;
      color: #aaa;
      padding: 8px 16px;
      cursor: pointer;
      font-size: 14px;
    }
    .share-tab.active {
      color: #ff2a55;
      border-bottom: 2px solid #ff2a55;
    }
    .social-grid {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .social-icon {
      background: #2c2c2c;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
    }
    .repost-btn, .download-btn {
      background: #2c2c2c;
      border: none;
      padding: 10px;
      border-radius: 40px;
      color: white;
      width: 100%;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
    }
    .download-progress {
      width: 100%;
      height: 4px;
      background: #333;
      border-radius: 2px;
      margin-top: 8px;
      display: none;
    }
    .download-progress .fill {
      width: 0%;
      height: 100%;
      background: #ff2a55;
      border-radius: 2px;
    }
    .refresh-indicator {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: #ff2a55;
      padding: 6px 12px;
      border-radius: 40px;
      font-size: 12px;
      z-index: 95;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    #globalToast {
      position: fixed;
      bottom: 80px;
      left: 20px;
      right: 20px;
      background: #1f1f1f;
      color: white;
      padding: 12px 16px;
      border-radius: 40px;
      text-align: center;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      font-size: 14px;
      border-left: 4px solid #ff2a55;
    }
    .warning-https {
      position: fixed;
      top: 50%;
      left: 20px;
      right: 20px;
      background: #ff2a55;
      color: white;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      z-index: 1000;
      transform: translateY(-50%);
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (function() {
      // التحقق من البيئة الآمنة (HTTPS أو localhost)
      const isSecure = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      if (!isSecure) {
        const warning = document.createElement('div');
        warning.className = 'warning-https';
        warning.innerHTML = '⚠️ الكاميرا تحتاج إلى HTTPS أو localhost. الرجاء استخدام <strong>localhost</strong> أو تشغيل الموقع عبر HTTPS.';
        document.body.appendChild(warning);
        setTimeout(() => warning.remove(), 5000);
        console.warn('Camera requires HTTPS or localhost');
      }

      // Supabase
      const SUPABASE_URL = 'https://fqowxtghefuykxyyrttk.supabase.co';
      const SUPABASE_ANON_KEY = 'sb_publishable_StGuaVLO7lfCsKF0Fr1dHQ_m10dbTOO';
      const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      let userId = localStorage.getItem('ramztok_user_id');
      if (!userId) {
        userId = 'user_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('ramztok_user_id', userId);
      }
      let currentUsername = localStorage.getItem('ramztok_username');
      if (!currentUsername) {
        currentUsername = 'ramz_tok';
        localStorage.setItem('ramztok_username', currentUsername);
      }

      let currentVideosList = [];
      let currentVideoIndex = 0;
      let observer = null;
      let recognition = null;

      let mediaStream = null;
      let mediaRecorder = null;
      let recordedChunks = [];
      let isRecording = false;
      let recordingStartTime = 0;
      let recordingTimerInterval = null;

      function formatNumber(num) {
        if (!num) return '0';
        if (num >= 1e6) return (num / 1e6).toFixed(1) + 'M';
        if (num >= 1e3) return (num / 1e3).toFixed(1) + 'K';
        return num.toString();
      }

      function showToast(msg, isError = false) {
        const toast = document.getElementById('globalToast');
        toast.textContent = msg;
        toast.style.opacity = '1';
        toast.style.backgroundColor = isError ? '#3a1e1e' : '#1f1f1f';
        toast.style.borderLeftColor = isError ? '#ff4444' : '#ff2a55';
        setTimeout(() => toast.style.opacity = '0', 3000);
      }

      // دوال قاعدة البيانات
      async function getFollowedUsers() {
        const { data } = await supabaseClient.from('follows').select('followed_user').eq('user_id', userId);
        return data?.map(row => row.followed_user) || [];
      }

      async function isFollowing(username) {
        const followed = await getFollowedUsers();
        return followed.includes(username);
      }

      async function followUser(username, btnElement) {
        const followed = await getFollowedUsers();
        if (!followed.includes(username)) {
          await supabaseClient.from('follows').insert({ user_id: userId, followed_user: username });
          if (btnElement) { btnElement.textContent = 'متابَع'; btnElement.classList.add('following'); }
          showToast(`تمت متابعة ${username}`);
        } else {
          await supabaseClient.from('follows').delete().match({ user_id: userId, followed_user: username });
          if (btnElement) { btnElement.textContent = 'متابعة'; btnElement.classList.remove('following'); }
          showToast(`تم إلغاء متابعة ${username}`);
        }
      }

      async function getLikesCount(videoId) {
        const { count } = await supabaseClient.from('video_likes').select('*', { count: 'exact', head: true }).eq('video_id', videoId);
        return count || 0;
      }

      async function isLikedByUser(videoId) {
        const { data } = await supabaseClient.from('video_likes').select('video_id').eq('user_id', userId).eq('video_id', videoId).maybeSingle();
        return !!data;
      }

      async function setLikeInDB(videoId, liked) {
        if (liked) await supabaseClient.from('video_likes').upsert({ user_id: userId, video_id: videoId });
        else await supabaseClient.from('video_likes').delete().match({ user_id: userId, video_id: videoId });
        return await getLikesCount(videoId);
      }

      async function getSavedVideos() {
        const { data } = await supabaseClient.from('saved_videos').select('video_id').eq('user_id', userId);
        return data?.map(row => row.video_id) || [];
      }

      async function toggleSave(videoId, iconElem) {
        const saved = await getSavedVideos();
        if (saved.includes(videoId)) {
          await supabaseClient.from('saved_videos').delete().match({ user_id: userId, video_id: videoId });
          iconElem.style.color = "white";
          showToast('تمت الإزالة من المحفوظات');
        } else {
          await supabaseClient.from('saved_videos').insert({ user_id: userId, video_id: videoId });
          iconElem.style.color = "#ff2a55";
          showToast('تم الحفظ في المفضلة');
        }
      }

      async function getFollowersCount(username) {
        const { count } = await supabaseClient.from('follows').select('*', { count: 'exact', head: true }).eq('followed_user', username);
        return count || 0;
      }

      async function loadVideosFromDB() {
        const { data } = await supabaseClient.from('videos').select('*').order('upload_time', { ascending: false });
        if (!data) return [];
        for (let v of data) v.followersCount = await getFollowersCount(v.user_name);
        return data;
      }

      async function uploadVideoToSupabase(videoBlob, description = "فيديو جديد", music = "صوت أصلي") {
        try {
          const fileName = `${Date.now()}_${Math.random().toString(36).substr(2, 6)}.mp4`;
          const fileToUpload = new File([videoBlob], fileName, { type: 'video/mp4' });
          const { error: uploadError } = await supabaseClient.storage.from('videos').upload(fileName, fileToUpload);
          if (uploadError) throw uploadError;
          const { data: publicUrlData } = supabaseClient.storage.from('videos').getPublicUrl(fileName);
          const videoUrl = publicUrlData.publicUrl;
          const newVideo = {
            id: Date.now().toString(),
            src: videoUrl,
            poster: "https://via.placeholder.com/400x600?text=RamzTok",
            description: description,
            user_name: currentUsername,
            user_avatar: `https://randomuser.me/api/portraits/lego/${Math.floor(Math.random()*10)}.jpg`,
            music: music,
            upload_time: new Date().toISOString(),
            comments: 0
          };
          const { error: insertError } = await supabaseClient.from('videos').insert(newVideo);
          if (insertError) throw insertError;
          showToast("تم رفع الفيديو بنجاح!");
          return newVideo;
        } catch (err) {
          console.error(err);
          showToast("فشل الرفع: " + err.message, true);
          return null;
        }
      }

      // دوال الكاميرا
      async function initCamera() {
        if (mediaStream) stopTracks();
        if (!isSecure) {
          showToast("البيئة غير آمنة، الكاميرا لن تعمل", true);
          return;
        }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
          mediaStream = stream;
          const videoElem = document.getElementById('cameraVideo');
          videoElem.srcObject = stream;
          await videoElem.play();
        } catch (err) {
          showToast("لا يمكن الوصول إلى الكاميرا: " + err.message, true);
        }
      }

      function stopTracks() {
        if (mediaStream) {
          mediaStream.getTracks().forEach(track => track.stop());
          mediaStream = null;
        }
        if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
        const videoElem = document.getElementById('cameraVideo');
        if (videoElem.srcObject) videoElem.srcObject = null;
      }

      function startRecording() {
        if (!mediaStream) { showToast("الكاميرا غير جاهزة", true); return; }
        recordedChunks = [];
        mediaRecorder = new MediaRecorder(mediaStream, { mimeType: 'video/webm' });
        mediaRecorder.ondataavailable = (event) => { if (event.data.size > 0) recordedChunks.push(event.data); };
        mediaRecorder.onstop = async () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          showPreviewAndUpload(blob, url);
        };
        mediaRecorder.start(1000);
        isRecording = true;
        recordingStartTime = Date.now();
        updateTimerDisplay();
        recordingTimerInterval = setInterval(updateTimerDisplay, 1000);
        document.getElementById('startRecordBtn').innerHTML = '<i class="fas fa-stop"></i>';
        document.getElementById('recordingTimer').style.display = 'block';
      }

      function stopRecording() {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
        isRecording = false;
        if (recordingTimerInterval) clearInterval(recordingTimerInterval);
        document.getElementById('startRecordBtn').innerHTML = '<i class="fas fa-video"></i>';
        document.getElementById('recordingTimer').style.display = 'none';
      }

      function updateTimerDisplay() {
        const elapsed = Math.floor((Date.now() - recordingStartTime) / 1000);
        const mins = Math.floor(elapsed / 60).toString().padStart(2, '0');
        const secs = (elapsed % 60).toString().padStart(2, '0');
        document.getElementById('recordingTimer').innerText = `${mins}:${secs}`;
      }

      function showPreviewAndUpload(blob, tempUrl) {
        closeCameraModal();
        Swal.fire({
          title: 'معاينة الفيديو',
          html: `<video controls autoplay muted style="width:100%; max-height:300px; border-radius:12px;" src="${tempUrl}"></video>
                 <input id="videoDesc" class="swal2-input" placeholder="وصف الفيديو" value="تحدي رمز توك">
                 <input id="videoMusic" class="swal2-input" placeholder="اسم الموسيقى" value="صوت أصلي">`,
          showCancelButton: true,
          confirmButtonText: 'رفع الآن',
          cancelButtonText: 'إلغاء',
          preConfirm: () => {
            const desc = document.getElementById('videoDesc').value;
            const music = document.getElementById('videoMusic').value;
            return { desc, music };
          }
        }).then(async (result) => {
          if (result.isConfirmed) {
            const { desc, music } = result.value;
            await uploadVideoToSupabase(blob, desc, music);
            const newVideos = await loadVideosFromDB();
            await renderVideos(newVideos);
          }
          URL.revokeObjectURL(tempUrl);
        });
      }

      function handleFileUpload(file) {
        if (!file || !file.type.startsWith('video/')) {
          showToast("الرجاء اختيار ملف فيديو صالح", true);
          return;
        }
        const blob = file.slice(0, file.size, file.type);
        const url = URL.createObjectURL(blob);
        showPreviewAndUpload(blob, url);
      }

      function openCameraModal() {
        const modal = document.getElementById('cameraModal');
        modal.classList.add('open');
        initCamera();
      }

      function closeCameraModal() {
        const modal = document.getElementById('cameraModal');
        modal.classList.remove('open');
        stopTracks();
        if (isRecording) stopRecording();
      }

      // عرض التغذية
      async function renderVideos(videosArray) {
        const feedContainer = document.getElementById('feedContainer');
        feedContainer.innerHTML = '';
        currentVideosList = videosArray;
        for (let idx = 0; idx < currentVideosList.length; idx++) {
          const video = currentVideosList[idx];
          const videoDiv = document.createElement('div');
          videoDiv.className = 'video-box';
          videoDiv.dataset.id = video.id;
          videoDiv.dataset.index = idx;

          const videoElem = document.createElement('video');
          videoElem.src = video.src;
          videoElem.poster = video.poster;
          videoElem.playsInline = true;
          videoElem.loop = false;
          videoElem.preload = idx === 0 ? 'auto' : 'metadata';
          videoElem.addEventListener('click', () => videoElem.paused ? videoElem.play() : videoElem.pause());
          videoElem.addEventListener('ended', () => goToNextVideo());

          const progressBar = document.createElement('div');
          progressBar.className = 'progress-bar';
          videoElem.addEventListener('timeupdate', () => {
            if (videoElem.duration) progressBar.style.width = (videoElem.currentTime / videoElem.duration) * 100 + '%';
          });

          const transcriptDiv = document.createElement('div');
          transcriptDiv.className = 'transcript';
          transcriptDiv.style.display = 'none';
          videoElem.addEventListener('play', () => {
            if (!recognition) initSpeechRecognition(videoElem, transcriptDiv);
            else try { recognition.start(); } catch(e) {}
          });

          let badgeHtml = '';
          if (video.followersCount >= 1000000) badgeHtml = '<i class="fas fa-gem diamond-badge"></i>';
          else if (video.followersCount >= 500000) badgeHtml = '<i class="fas fa-star gold-badge"></i>';

          const infoDiv = document.createElement('div');
          infoDiv.className = 'video-info';
          infoDiv.innerHTML = `
            <div class="user-info">
              <img class="avatar" src="${video.user_avatar}">
              <span class="username">${video.user_name} ${badgeHtml}</span>
              <button class="follow-btn ${(await isFollowing(video.user_name)) ? 'following' : ''}">${(await isFollowing(video.user_name)) ? 'متابَع' : 'متابعة'}</button>
            </div>
            <div class="description">${video.description || 'فيديو جديد'}</div>
            <div class="music-icon"><i class="fas fa-music spin"></i><span>${video.music || 'موسيقى'}</span></div>
          `;
          infoDiv.appendChild(transcriptDiv);

          const finalLikes = await getLikesCount(video.id);
          const saved = await getSavedVideos();
          const isVideoSaved = saved.includes(video.id);
          const sideActions = document.createElement('div');
          sideActions.className = 'side-actions';
          sideActions.innerHTML = `
            <button class="action-btn like-btn"><i class="fas fa-heart"></i><span class="likes-count">${formatNumber(finalLikes)}</span></button>
            <button class="action-btn comment-btn"><i class="fas fa-comment"></i><span>${formatNumber(video.comments)}</span></button>
            <button class="action-btn share-btn"><i class="fas fa-share"></i><span>مشاركة</span></button>
            <button class="action-btn save-btn"><i class="fas fa-bookmark" style="color: ${isVideoSaved ? '#ff2a55' : 'white'}"></i><span>حفظ</span></button>
          `;

          videoDiv.appendChild(videoElem);
          videoDiv.appendChild(progressBar);
          videoDiv.appendChild(infoDiv);
          videoDiv.appendChild(sideActions);
          feedContainer.appendChild(videoDiv);
        }
        attachButtonsEvents();
        setupIntersectionObserver();
      }

      function initSpeechRecognition(videoElement, transcriptContainer) {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) return;
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.lang = 'ar-AR';
        recognition.continuous = true;
        recognition.interimResults = false;
        recognition.onresult = (event) => {
          let final = '';
          for (let i = event.resultIndex; i < event.results.length; i++)
            if (event.results[i].isFinal) final += event.results[i][0].transcript + ' ';
          if (final) {
            transcriptContainer.innerText = '📝 ' + final;
            transcriptContainer.style.display = 'block';
          }
        };
        recognition.onend = () => setTimeout(() => recognition.start(), 2000);
        recognition.start();
        videoElement.addEventListener('pause', () => recognition?.stop());
        videoElement.addEventListener('ended', () => recognition?.stop());
        videoElement.addEventListener('play', () => recognition?.start());
      }

      async function attachButtonsEvents() {
        for (let idx = 0; idx < currentVideosList.length; idx++) {
          const video = currentVideosList[idx];
          const videoDiv = document.getElementById('feedContainer').children[idx];
          if (!videoDiv) continue;
          const followBtn = videoDiv.querySelector('.follow-btn');
          const likeBtn = videoDiv.querySelector('.like-btn');
          const commentBtn = videoDiv.querySelector('.comment-btn');
          const saveBtn = videoDiv.querySelector('.save-btn');
          const avatar = videoDiv.querySelector('.avatar');
          const usernameSpan = videoDiv.querySelector('.username');
          const desc = videoDiv.querySelector('.description');

          if (followBtn) followBtn.onclick = (e) => { e.stopPropagation(); followUser(video.user_name, followBtn); };
          if (likeBtn) {
            let liked = await isLikedByUser(video.id);
            const countSpan = likeBtn.querySelector('.likes-count');
            const heartIcon = likeBtn.querySelector('i');
            heartIcon.style.color = liked ? '#ff2a55' : 'white';
            likeBtn.onclick = async (e) => {
              e.stopPropagation();
              liked = !liked;
              const newTotal = await setLikeInDB(video.id, liked);
              countSpan.innerText = formatNumber(newTotal);
              heartIcon.style.color = liked ? '#ff2a55' : 'white';
              heartIcon.classList.add('animate');
              setTimeout(() => heartIcon.classList.remove('animate'), 300);
            };
          }
          if (commentBtn) commentBtn.onclick = (e) => { e.stopPropagation(); window.location.href = `comments.html?id=${video.id}`; };
          if (saveBtn) {
            const icon = saveBtn.querySelector('i');
            saveBtn.onclick = async (e) => { e.stopPropagation(); await toggleSave(video.id, icon); };
          }
          if (avatar) avatar.onclick = (e) => { e.stopPropagation(); window.location.href = `profile.html?user=${video.user_name}`; };
          if (usernameSpan) usernameSpan.onclick = (e) => { e.stopPropagation(); window.location.href = `profile.html?user=${video.user_name}`; };
          if (desc) desc.onclick = (e) => { e.stopPropagation(); desc.classList.toggle('expanded'); };
        }
        attachShareButtons();
      }

      function attachShareButtons() {
        document.querySelectorAll('.share-btn').forEach(btn => {
          btn.onclick = async (e) => {
            e.stopPropagation();
            const idx = parseInt(btn.closest('.video-box').dataset.index);
            await openShareModal(currentVideosList[idx]);
          };
        });
      }

      let currentShareVideo = null;
      async function openShareModal(video) {
        currentShareVideo = video;
        const modal = document.getElementById('shareModal');
        modal.classList.add('open');
        renderShareTab('social');
      }

      function renderShareTab(tab) {
        const container = document.getElementById('shareContent');
        if (tab === 'social') {
          container.innerHTML = `<div class="social-grid">
            <div class="social-icon" data-platform="whatsapp"><i class="fab fa-whatsapp"></i></div>
            <div class="social-icon" data-platform="facebook"><i class="fab fa-facebook-f"></i></div>
            <div class="social-icon" data-platform="twitter"><i class="fab fa-twitter"></i></div>
            <div class="social-icon" data-platform="telegram"><i class="fab fa-telegram"></i></div>
          </div>`;
          document.querySelectorAll('.social-icon').forEach(icon => {
            icon.addEventListener('click', () => shareToSocial(icon.dataset.platform));
          });
        } else if (tab === 'repost') {
          container.innerHTML = `<button class="repost-btn" id="repostNowBtn"><i class="fas fa-retweet"></i> إعادة نشر</button>`;
          document.getElementById('repostNowBtn').addEventListener('click', () => repostVideo());
        } else if (tab === 'download') {
          container.innerHTML = `<button class="download-btn" id="downloadVideoBtn"><i class="fas fa-download"></i> تحميل الفيديو</button><div class="download-progress" id="downloadProgress"><div class="fill"></div></div>`;
          document.getElementById('downloadVideoBtn').addEventListener('click', () => downloadVideo());
        } else if (tab === 'chat') {
          container.innerHTML = `<div class="recent-users" id="recentUsersList">جار التحميل...</div>`;
          loadRecentChats();
        }
      }

      async function shareToSocial(platform) {
        let url = window.location.href + `?video=${currentShareVideo.id}`;
        let shareLink = '';
        if (platform === 'whatsapp') shareLink = `https://wa.me/?text=${encodeURIComponent(url)}`;
        else if (platform === 'facebook') shareLink = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`;
        else if (platform === 'twitter') shareLink = `https://twitter.com/intent/tweet?url=${encodeURIComponent(url)}`;
        else if (platform === 'telegram') shareLink = `https://t.me/share/url?url=${encodeURIComponent(url)}`;
        if (shareLink) window.open(shareLink, '_blank');
        showToast(`تمت المشاركة عبر ${platform}`);
      }

      async function repostVideo() {
        await supabaseClient.from('reposts').insert({ user_id: userId, video_id: currentShareVideo.id });
        showToast('تمت إعادة النشر');
        document.getElementById('shareModal').classList.remove('open');
      }

      async function downloadVideo() {
        const progressDiv = document.getElementById('downloadProgress');
        progressDiv.style.display = 'block';
        try {
          const response = await fetch(currentShareVideo.src);
          const blob = await response.blob();
          saveAs(blob, `video_${currentShareVideo.id}.mp4`);
          showToast('تم التحميل');
        } catch(e) { showToast('فشل التحميل', true); }
        progressDiv.style.display = 'none';
      }

      async function loadRecentChats() {
        const { data } = await supabaseClient.from('messages').select('sender_username, receiver_username').or(`sender_username.eq.${currentUsername},receiver_username.eq.${currentUsername}`).limit(10);
        let users = new Set();
        data?.forEach(m => {
          if (m.sender_username !== currentUsername) users.add(m.sender_username);
          if (m.receiver_username !== currentUsername) users.add(m.receiver_username);
        });
        const container = document.getElementById('recentUsersList');
        if (users.size === 0) { container.innerHTML = '<div>لا توجد محادثات</div>'; return; }
        container.innerHTML = Array.from(users).map(u => `<div class="recent-user" data-user="${u}"><img class="recent-avatar" src="https://randomuser.me/api/portraits/lego/1.jpg"><span class="recent-name">${u}</span></div>`).join('');
        document.querySelectorAll('.recent-user').forEach(el => el.addEventListener('click', () => sendVideoToUser(el.dataset.user)));
      }

      async function sendVideoToUser(receiver) {
        await supabaseClient.from('messages').insert({ sender_username: currentUsername, receiver_username: receiver, content: `شارك معك فيديو: ${window.location.origin}?video=${currentShareVideo.id}` });
        showToast(`تم الإرسال إلى ${receiver}`);
        document.getElementById('shareModal').classList.remove('open');
      }

      function setupIntersectionObserver() {
        if (observer) observer.disconnect();
        observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const videoElem = entry.target.querySelector('video');
              document.querySelectorAll('.video-box video').forEach(v => { if (v !== videoElem) v.pause(); });
              videoElem.play().catch(e => console.log);
              currentVideoIndex = parseInt(entry.target.dataset.index);
            }
          });
        }, { threshold: 0.6 });
        document.querySelectorAll('.video-box').forEach(box => observer.observe(box));
      }

      function goToNextVideo() {
        if (currentVideoIndex < currentVideosList.length - 1)
          document.getElementById('feedContainer').children[currentVideoIndex + 1].scrollIntoView({ behavior: 'smooth' });
        else loadMoreVideos();
      }

      async function loadMoreVideos() {
        const newVideos = await loadVideosFromDB();
        if (newVideos.length) {
          const existingIds = new Set(currentVideosList.map(v => v.id));
          const fresh = newVideos.filter(v => !existingIds.has(v.id));
          if (fresh.length) {
            currentVideosList.push(...fresh);
            await renderVideos(currentVideosList);
          }
        }
      }

      async function refreshForYou() {
        const ind = document.getElementById('refreshIndicator');
        ind.style.opacity = '1';
        const newVideos = await loadVideosFromDB();
        await renderVideos(newVideos);
        ind.style.opacity = '0';
      }

      function attachGlobalEvents() {
        document.getElementById('searchButton').addEventListener('click', () => window.location.href = 'search.html');
        document.getElementById('liveButton').addEventListener('click', () => window.location.href = 'live.html');
        document.getElementById('forYouTab').addEventListener('click', (e) => { e.preventDefault(); refreshForYou(); });
        document.getElementById('createCameraBtn').addEventListener('click', openCameraModal);
        document.getElementById('closeCameraBtn').addEventListener('click', closeCameraModal);
        document.getElementById('startRecordBtn').addEventListener('click', () => isRecording ? stopRecording() : startRecording());
        document.getElementById('uploadFileBtn').addEventListener('click', () => document.getElementById('fileInput').click());
        document.getElementById('chooseFileBtn').addEventListener('click', () => document.getElementById('fileInput').click());
        document.getElementById('fileInput').addEventListener('change', (e) => { if (e.target.files.length) handleFileUpload(e.target.files[0]); e.target.value = ''; });
        window.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowDown') { e.preventDefault(); goToNextVideo(); }
          if (e.key === 'ArrowUp') { e.preventDefault(); if (currentVideoIndex > 0) document.getElementById('feedContainer').children[currentVideoIndex - 1].scrollIntoView({ behavior: 'smooth' }); }
        });
      }

      async function init() {
        const videos = await loadVideosFromDB();
        await renderVideos(videos);
        attachGlobalEvents();
        if ("Notification" in window) Notification.requestPermission();
      }
      init();
    })();
  </script>
</body>
</html>
